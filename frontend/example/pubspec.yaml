# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

name: ultralytics_yolo_example
description: "Demonstrates how to use the ultralytics_yolo plugin."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.2.0
  dio: ^5.9.0
  path_provider: ^2.0.0 # Adjust version as needed
  archive: ^4.0.7 # Adjust version as needed, for unzipping
  http: ^1.5.0 # For downloading models
  http_parser: ^4.1.2
  device_info_plus: ^12.1.0
  geolocator: ^14.0.2
  sensors_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  exif: ^3.3.0
  intl: ^0.18.1
  photo_manager: ^3.7.1
  geocoding: ^4.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  ultralytics_yolo:
    path: ../

  

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/MapPinRoad_maxfill_blue_1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/base_model_float16.tflite
    - assets/models/best_float16.tflite
    - assets/logo.png
    - assets/applogo.png
    - assets/icon/MapPinRoad_maxfill_blue_1024.png

  fonts: 
    - family: NanumSquareRound
      fonts:
        - asset: assets/fonts/NanumSquareRoundR.ttf
        - asset: assets/fonts/NanumSquareRoundB.ttf
          weight: 700
